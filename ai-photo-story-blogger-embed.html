<script>
(function() {
  var widget = document.getElementById('ai-story-widget');
  var slides = widget.querySelectorAll('.ai-slide');
  var bars = widget.querySelectorAll('.ai-bar');
  var current = 0;
  var total = slides.length;

  function render() {
    slides.forEach(function(s, i) { s.style.display = (i === current) ? 'block' : 'none'; });
    bars.forEach(function(b, i) {
      var fill = b.querySelector('.ai-bar-fill');
      fill.style.width = (i <= current) ? '100%' : '0%';
    });
  }

  window.aiStoryNext = function() { if (current < total - 1) { current++; render(); } };
  window.aiStoryPrev = function() { if (current > 0) { current--; render(); } };

  render();
})();
</script>
